<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Analyzer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 45 45'%3E%3Crect width='45' height='45' rx='9' fill='%231d6f6a'/%3E%3Cpath d='M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-2 2.5-3c1 0 1 3 1 3' fill='%23fff' stroke='%23fff' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app">
  <div class="appbar">
    <a class="brand" href="#/overview">
      <svg viewBox="0 0 45 45"><rect width="45" height="45" rx="10" fill="var(--accent)"/><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-2 2.5-3c1 0 1 3 1 3" fill="var(--accent-ink)" stroke="var(--accent-ink)" stroke-width="1.5" stroke-linejoin="round"/></svg>
      Chess Analyzer <span class="ver">2.0</span>
    </a>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <select id="f-format" title="Which games every page reports on"></select>
      <input id="f-user" placeholder="chess.com account" autocomplete="off" spellcheck="false" title="Any Chess.com account — its games are synced automatically">
      <button class="iconbtn" id="theme" title="Light / dark">◐</button>
    </div>
  </div>
  <div class="jobbar"><div class="fill" id="job-fill"></div></div>
  <div class="jobline" id="job-line"></div>
</header>
<main class="page">
  <div class="status" id="status"></div>
  <div id="view"></div>
</main>
<script type="module" src="/js/main.js"></script>
</body>
</html>
