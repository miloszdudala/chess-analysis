<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Analyzer</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { padding-top: 0; }
  header.app { position: sticky; top: 0; z-index: 5; background: #fbfaf7e6;
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: .9rem 1.1rem; }
  .appbar { max-width: 960px; margin: 0 auto; display: flex; align-items: center;
    gap: 1.5rem; flex-wrap: wrap; }
  .brand { font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
  .tabs { display: flex; gap: 1.1rem; }
  .tab { background: none; border: 0; color: var(--mut); cursor: pointer; font: inherit;
    padding: .2rem 0; border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .sync { background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); border-radius: 8px; padding: .4rem .85rem; cursor: pointer;
    font: inherit; font-size: .85rem; }
  .sync:first-of-type { margin-left: auto; }
  .sync:hover { border-color: var(--accent); color: var(--accent); }
  .sync:disabled { opacity: .55; cursor: default; }
  .prewarm { max-width: 960px; margin: .3rem auto 0; font-size: .82rem; color: var(--mut);
    display: none; align-items: center; gap: .6rem; }
  .prewarm.on { display: flex; }
  .prewarm .pw-track { flex: 1; height: 6px; background: var(--line); border-radius: 4px;
    overflow: hidden; max-width: 320px; }
  .prewarm .pw-fill { height: 100%; width: 0; background: var(--accent);
    transition: width .4s ease; }
  .prewarm.done .pw-fill { background: var(--win); }
  .prewarm .pw-txt { white-space: nowrap; }
  .controls { max-width: 960px; margin: 1.3rem auto .4rem; display: flex; gap: .7rem;
    align-items: end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: .3rem; }
  .field label { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--mut); }
  .field input, .field select { background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: .5rem .6rem; font: inherit; }
  .field input { min-width: 11rem; } .field select.wide { min-width: 22rem; }
  button.go { background: var(--accent); color: #fff; border: 0; font-weight: 600;
    border-radius: 8px; padding: .58rem 1.2rem; cursor: pointer; font: inherit; }
  button.go:disabled { opacity: .5; cursor: default; }
  .chips { max-width: 960px; margin: .3rem auto; display: flex; gap: .4rem; flex-wrap: wrap;
    align-items: center; }
  .chips .lead { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--mut); margin-right: .2rem; }
  .chip { background: var(--panel); border: 1px solid var(--line); color: var(--mut);
    border-radius: 999px; padding: .25rem .7rem; cursor: pointer; font-size: .82rem; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .status { max-width: 960px; margin: .4rem auto; color: var(--mut); min-height: 1.1rem;
    font-size: .85rem; }
  .status.err { color: var(--loss); }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px; margin-right: .5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result h1 { margin: .6rem 0 .15rem; }
</style>
</head>
<body>
<header class="app">
  <div class="appbar">
    <span class="brand">♟ Chess Analyzer</span>
    <div class="tabs" id="tabs"></div>
    <button class="sync" id="prewarm" title="Analyze every game at review depth in the background so Game Review opens instantly">⚡ Prepare reviews</button>
    <button class="sync" id="sync" title="Download new games from Chess.com">⟳ Sync games</button>
  </div>
</header>

<div class="controls" id="controls"></div>
<div class="chips" id="chips"></div>
<div class="status" id="status"></div>
<div class="prewarm" id="prewarm-bar">
  <div class="pw-track"><div class="pw-fill" id="pw-fill"></div></div>
  <span class="pw-txt" id="pw-txt"></span>
</div>

<div class="wrap"><div id="result"></div></div>

<script src="/app.js"></script>
</body>
</html>
